<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>OPERATION COO</title><base target="_blank">
</head><body>

<style>
body{margin:0;background:#0b0e17;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:ui-monospace,Menlo,Consolas,monospace;color:#9fe870}
#wrap{text-align:center}
#hint{font-size:12px;color:#5b6b85;margin-top:8px}
canvas{background:#87ceeb;border:3px solid #2a3550;border-radius:6px;box-shadow:0 0 40px rgba(80,220,255,.12);outline:none;max-width:100%;height:auto;cursor:crosshair}
</style>
<div id="wrap">
<canvas id="c" width="960" height="600" tabindex="0"></canvas>
<div id="hint">WASD / arrows to fly &nbsp;·&nbsp; hold SPACE next to your target to scan &nbsp;·&nbsp; R to retry</div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=2000,H=1300,VW=960,VH=600;
cv.width=VW;cv.height=VH;
const keys={};
let state='brief',tGame=0,scan=0,alert=0,alertMax=0,camx=0,camy=0,intel=0,best=0,pingT=0,wrongFlash=0;
let people=[],target=null,prevTarget=null;
let feathers=[],scanFx=[],rings=[],floaters=[];
addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();
 if(e.code==='Enter'&&state==='brief')startGame();
 if(e.code==='KeyR'&&state==='fail')startGame();
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

const park={x:660,y:880,w:760,h:420};
const fountain={x:1090,y:1120,r:32};
const p={x:170,y:1180,vx:0,vy:0,a:0};

const buildings=[
 {x:80,y:60,w:260,h:180},{x:420,y:40,w:200,h:240},{x:700,y:90,w:300,h:160},
 {x:1120,y:50,w:240,h:220},{x:1480,y:70,w:280,h:180},{x:60,y:360,w:220,h:260},
 {x:380,y:380,w:280,h:180},{x:760,y:340,w:200,h:260},{x:1100,y:380,w:320,h:160},
 {x:1560,y:360,w:240,h:240},{x:120,y:760,w:300,h:110},{x:520,y:800,w:240,h:80},
 {x:980,y:760,w:260,h:100},{x:1640,y:760,w:220,h:100}
];
const sr=s=>{const x=Math.sin(s*999.7)*10000;return x-Math.floor(x);};
const trees=[];
for(let i=0;i<26;i++){
 const tx=park.x+20+sr(i)*(park.w-40),ty=park.y+20+sr(i+50)*(park.h-40);
 if(Math.hypot(tx-fountain.x,ty-fountain.y)>70)trees.push({x:tx,y:ty,r:10+sr(i+99)*8});
}
const guards=[
 {wps:[[1160,1010],[1390,1010],[1390,1250],[1130,1250]],x:1160,y:1010,i:1,a:0,see:false},
 {wps:[[700,950],[700,1260],[880,1260],[880,960]],x:700,y:950,i:1,a:0,see:false},
 {wps:[[860,330],[1380,330]],x:860,y:330,i:1,a:0,see:false},
 {wps:[[240,680],[920,680]],x:240,y:680,i:1,a:0,see:false}
];
const GRANGE=240,GHALF=0.66;
const clouds=[];
for(let i=0;i<6;i++)clouds.push({x:sr(i+7)*W,y:40+sr(i+31)*500,s:.7+sr(i+57)*.8,v:8+sr(i+77)*10});

// ---- crowd ----
const SKINS=['#f7d7b8','#eebd93','#d69a6b','#a9714b','#7a4e2f'];
const HAIRC={'BLACK':'#23262e','BROWN':'#5a3a22','BLONDE':'#d9b44a','RED':'#a84e32','GREY':'#9aa0a8'};
const SHIRTS={'CRIMSON':'#c0392b','SKY':'#4aa3df','NAVY':'#2c3e70','OLIVE':'#6b7f3a','MUSTARD':'#d9a521','PLUM':'#7d3c7a','TEAL':'#2a9d8f','CORAL':'#e76f51','PINK':'#e27fa5','WHITE':'#e9e9e9','BLACK':'#2b2b2b','GREY':'#8d99ae'};
const PANTS={'NAVY':'#2c3e70','DENIM':'#4a6fa5','BLACK':'#2b2b2b','KHAKI':'#b0a179','GREY':'#7d8590','OLIVE':'#6b7f3a','WHITE':'#e9e9e9'};
const HATC={'CRIMSON':'#c0392b','SKY':'#4aa3df','NAVY':'#2c3e70','BLACK':'#2b2b2b','MUSTARD':'#d9a521'};
const pickK=o=>{const k=Object.keys(o);return k[Math.floor(Math.random()*k.length)];};
const pickA=a=>a[Math.floor(Math.random()*a.length)];
function makePerson(x,y){
 const hairName=pickK(HAIRC),shirtName=pickK(SHIRTS),pantsName=pickK(PANTS);
 return {x,y,a:Math.random()*7,wx:40+Math.random()*(W-80),wy:40+Math.random()*(H-80),
  speed:25+Math.random()*35,walkPhase:Math.random()*7,
  skinC:pickA(SKINS),hair:Math.random()<0.15?'BALD':pickA(['SHORT','SHORT','LONG','SPIKY','BUN','MOHAWK']),
  hairName,hairC:HAIRC[hairName],shirtName,shirtC:SHIRTS[shirtName],
  pantsName,pantsC:PANTS[pantsName],hat:Math.random()<0.5?'NONE':pickA(['CAP','BEANIE']),
  hatC:HATC[pickK(HATC)],glasses:Math.random()<0.3};
}
function inBuilding(x,y){for(const b of buildings){if(x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h)return true;}return false;}

// ---- target profile portrait ----
const pcv=document.createElement('canvas');pcv.width=92;pcv.height=116;
function renderProfile(){
 const pg=pcv.getContext('2d');
 pg.fillStyle='#1a2433';pg.fillRect(0,0,92,116);
 pg.save();pg.translate(46,94);pg.scale(2.5,2.5);
 drawPerson(pg,Object.assign({},target,{walkPhase:0}),0,0,0,true);
 pg.restore();
 pg.strokeStyle='rgba(159,232,112,.8)';pg.strokeRect(0.5,0.5,91,115);
}
function pickTarget(){
 do{target=people[Math.floor(Math.random()*people.length)];}while(target===prevTarget);
 prevTarget=target;renderProfile();
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawPerson(c,pr,x,y,a,front){
 const swing=front?0:Math.sin(pr.walkPhase)*4;
 c.save();c.translate(x,y);if(!front)c.rotate(a);
 c.fillStyle='rgba(0,0,0,.22)';c.beginPath();c.ellipse(0,14,9,3.5,0,0,7);c.fill();
 c.strokeStyle=pr.pantsC;c.lineWidth=4;c.lineCap='round';c.beginPath();
 if(front){c.moveTo(-3,2);c.lineTo(-3,12);c.moveTo(3,2);c.lineTo(3,12);}
 else{c.moveTo(0,2);c.lineTo(-2+swing,12);c.moveTo(0,2);c.lineTo(2-swing,12);}
 c.stroke();
 c.fillStyle=pr.shirtC;rr(c,-7,-10,14,14,4);c.fill();
 c.strokeStyle=pr.shirtC;c.lineWidth=3.5;c.beginPath();
 if(front){c.moveTo(-7,-7);c.lineTo(-9.5,1);c.moveTo(7,-7);c.lineTo(9.5,1);}
 else{c.moveTo(0,-8);c.lineTo(2-swing*0.6,0);c.moveTo(0,-8);c.lineTo(-2+swing*0.6,0);}
 c.stroke();
 c.fillStyle=pr.skinC;c.beginPath();
 if(front){c.arc(-9.5,2,1.8,0,7);c.arc(9.5,2,1.8,0,7);}
 else{c.arc(2-swing*0.6,1,1.8,0,7);}
 c.fill();
 c.fillStyle=pr.skinC;c.beginPath();c.arc(0,-16,6.5,0,7);c.fill();
 c.fillStyle=pr.hairC;
 if(pr.hair==='SHORT'){c.beginPath();c.arc(0,-17,6.8,Math.PI,0);c.fill();}
 else if(pr.hair==='LONG'){c.beginPath();c.arc(0,-17,6.8,Math.PI,0);c.fill();
  if(front){c.fillRect(-7,-16,3,10);c.fillRect(4,-16,3,10);}else c.fillRect(-8,-16,3.5,9);}
 else if(pr.hair==='SPIKY'){for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*2.6-1.4,-20);c.lineTo(i*2.6,-27+(i%2?2:0));c.lineTo(i*2.6+1.4,-20);c.closePath();c.fill();}}
 else if(pr.hair==='BUN'){c.beginPath();c.arc(0,-17,6.8,Math.PI,0);c.fill();c.beginPath();c.arc(front?0:-4,-23.5,3,0,7);c.fill();}
 else if(pr.hair==='MOHAWK'){c.fillRect(-1.4,-26.5,2.8,9.5);}
 if(front){
  c.fillStyle='#fff';c.beginPath();c.arc(-2.6,-17,1.7,0,7);c.arc(2.6,-17,1.7,0,7);c.fill();
  c.fillStyle='#222';c.beginPath();c.arc(-2.6,-17,0.85,0,7);c.arc(2.6,-17,0.85,0,7);c.fill();
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=0.8;
  c.beginPath();c.moveTo(-4.4,-20);c.lineTo(-1.2,-20);c.moveTo(1.2,-20);c.lineTo(4.4,-20);c.stroke();
  c.beginPath();c.arc(0,-13.2,2,0.2*Math.PI,0.8*Math.PI);c.stroke();
  c.beginPath();c.moveTo(0,-15.8);c.lineTo(0,-14.4);c.stroke();
 }else{
  c.fillStyle='#fff';c.beginPath();c.arc(3.4,-17,1.7,0,7);c.fill();
  c.fillStyle='#222';c.beginPath();c.arc(3.7,-17,0.85,0,7);c.fill();
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=0.8;
  c.beginPath();c.arc(2.8,-13.2,1.8,0.15*Math.PI,0.75*Math.PI);c.stroke();
 }
 if(pr.glasses){c.strokeStyle='#222';c.lineWidth=1;
  if(front){c.beginPath();c.arc(-2.6,-17,2.5,0,7);c.stroke();c.beginPath();c.arc(2.6,-17,2.5,0,7);c.stroke();c.beginPath();c.moveTo(-0.3,-17);c.lineTo(0.3,-17);c.stroke();}
  else{c.beginPath();c.arc(3.4,-17,2.5,0,7);c.stroke();}}
 if(pr.hat==='CAP'){c.fillStyle=pr.hatC;c.beginPath();c.arc(0,-18,6.4,Math.PI,0);c.fill();c.fillRect(front?-6:0,-19.2,12,2.8);}
 if(pr.hat==='BEANIE'){c.fillStyle=pr.hatC;c.beginPath();c.arc(0,-16.5,6.7,Math.PI,0);c.fill();c.fillRect(-6.7,-17.6,13.4,3.6);c.beginPath();c.arc(0,-24.5,2.2,0,7);c.fill();}
 c.restore();
}

function segRect(x1,y1,x2,y2,r){
 const dx=x2-x1,dy=y2-y1;let t0=0,t1=1;
 const clip=(p_,q_)=>{if(p_===0)return q_>=0;const r_=q_/p_;
  if(p_<0){if(r_>t1)return false;if(r_>t0)t0=r_;}
  else{if(r_<t0)return false;if(r_<t1)t1=r_;}return true;};
 return clip(-dx,x1-r.x)&&clip(dx,r.x+r.w-x1)&&clip(-dy,y1-r.y)&&clip(dy,r.y+r.h-y1);
}
function losBlocked(x1,y1,x2,y2){for(const b of buildings){if(segRect(x1,y1,x2,y2,b))return true;}return false;}

function startGame(){
 state='play';tGame=0;scan=0;alert=0;alertMax=0;intel=0;pingT=0;wrongFlash=0;
 p.x=170;p.y=1180;p.vx=p.vy=0;p.a=0;
 feathers=[];scanFx=[];rings=[];floaters=[];
 people=[];
 for(let i=0;i<36;i++){const pr=makePerson(40+Math.random()*(W-80),40+Math.random()*(H-80));people.push(pr);}
 pickTarget();
}
function update(dt){
 if(state!=='play')return;
 tGame+=dt;
 const ax=((keys.ArrowRight||keys.KeyD)?1:0)-((keys.ArrowLeft||keys.KeyA)?1:0);
 const ay=((keys.ArrowDown||keys.KeyS)?1:0)-((keys.ArrowUp||keys.KeyW)?1:0);
 p.vx+=ax*640*dt;p.vy+=ay*640*dt;
 const damp=Math.exp(-2.2*dt);p.vx*=damp;p.vy*=damp;
 const sp=Math.hypot(p.vx,p.vy),mx=330;
 if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
 p.x+=p.vx*dt;p.y+=p.vy*dt;
 p.x=Math.max(16,Math.min(W-16,p.x));p.y=Math.max(16,Math.min(H-16,p.y));
 if(sp>40){const ta=Math.atan2(p.vy,p.vx);let da=ta-p.a;
  while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
  p.a+=da*Math.min(1,10*dt);}
 if(sp>120&&Math.random()<dt*6)
  feathers.push({x:p.x-Math.cos(p.a)*14,y:p.y-Math.sin(p.a)*14,
   vx:-p.vx*.15+(Math.random()-.5)*30,vy:-20+Math.random()*20,l:1});
 // crowd
 for(const pr of people){
  const dx=pr.wx-pr.x,dy=pr.wy-pr.y,d=Math.hypot(dx,dy);
  if(d<10||inBuilding(pr.x,pr.y)){pr.wx=40+Math.random()*(W-80);pr.wy=40+Math.random()*(H-80);}
  else{pr.x+=dx/d*pr.speed*dt;pr.y+=dy/d*pr.speed*dt;const ta=Math.atan2(dy,dx);let da=ta-pr.a;
   while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
   pr.a+=da*Math.min(1,6*dt);}
  pr.walkPhase+=dt*pr.speed*0.45;
 }
 // guards
 let seen=false;
 for(const gd of guards){
  const wp=gd.wps[gd.i],dx=wp[0]-gd.x,dy=wp[1]-gd.y,d=Math.hypot(dx,dy);
  if(d<6){gd.i=(gd.i+1)%gd.wps.length;}
  else{gd.x+=dx/d*70*dt;gd.y+=dy/d*70*dt;const ta=Math.atan2(dy,dx);let da=ta-gd.a;
   while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
   gd.a+=da*Math.min(1,8*dt);}
  const pdx=p.x-gd.x,pdy=p.y-gd.y,pd=Math.hypot(pdx,pdy);
  gd.see=false;
  if(pd<GRANGE){let da=Math.atan2(pdy,pdx)-gd.a;
   while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
   if(Math.abs(da)<GHALF&&!losBlocked(gd.x,gd.y,p.x,p.y)){gd.see=true;seen=true;}}
 }
 alert=Math.max(0,Math.min(100,alert+(seen?48:-26)*dt));
 if(seen)alertMax=Math.max(alertMax,alert);
 if(alert>=100){state='fail';best=Math.max(best,intel);}
 // scan nearest person
 let nearest=null,nd=1e9;
 for(const pr of people){const d=Math.hypot(p.x-pr.x,p.y-pr.y);if(d<nd){nd=d;nearest=pr;}}
 const inRange=nd<175;
 if(inRange&&keys.Space){
  if(nearest===target){
   scan=Math.min(1,scan+dt/2.5);
   rings.push({x:p.x,y:p.y,r:6,l:1});
   if(Math.random()<dt*20)scanFx.push({t:0});
   if(scan>=1){
    intel++;
    floaters.push({x:nearest.x,y:nearest.y-32,text:'INTEL SECURED #'+intel,t:1.6,c:'#9fe870'});
    Object.assign(nearest,makePerson(nearest.x,nearest.y));
    scan=0;pickTarget();
   }
  }else{
   alert=Math.min(100,alert+22*dt);wrongFlash=1;
   if(Math.random()<dt*1.5)
    floaters.push({x:nearest.x,y:nearest.y-32,text:pickA(['HEY!','MY EYES!','A PIGEON?!','SECURITY!']),t:1.2,c:'#ff8080'});
  }
 }else scan=Math.max(0,scan-dt*.45);
 wrongFlash=Math.max(0,wrongFlash-dt*1.5);
 // sat-link ping on target
 pingT+=dt;
 if(pingT>3.5){pingT=0;rings.push({x:target.x,y:target.y,r:12,l:1.3,gold:true});}
 feathers=feathers.filter(f=>{f.l-=dt*.7;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=40*dt;return f.l>0;});
 rings=rings.filter(r=>{r.r+=150*dt;r.l-=dt*1.2;return r.l>0;});
 scanFx=scanFx.filter(s=>{s.t+=dt*2.4;return s.t<1;});
 floaters=floaters.filter(f=>{f.t-=dt;f.y-=22*dt;return f.t>0;});
 for(const c of clouds){c.x+=c.v*dt;if(c.x>W+140)c.x=-140;}
}
function drawPigeon(x,y,a){
 const t=performance.now()/1000,sp=Math.hypot(p.vx,p.vy);
 const flap=Math.sin(t*(8+sp*0.02))*(0.55+Math.min(sp/300,1)*0.45);
 g.save();g.translate(x,y);g.rotate(a);
 function wing(s){g.save();g.scale(1,s);g.rotate(flap*0.8);
  g.fillStyle=s>0?'#c3cddd':'#8fa0ba';
  g.beginPath();g.ellipse(-2,-6,15,6,-0.35,0,7);g.fill();g.restore();}
 g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(0,14,12,4,0,0,7);g.fill();
 g.fillStyle='#7f8ea3';g.beginPath();g.moveTo(-12,0);g.lineTo(-25,-6);g.lineTo(-25,6);g.closePath();g.fill();
 wing(-1);
 g.fillStyle='#aeb9cc';g.beginPath();g.ellipse(0,0,16,10,0,0,7);g.fill();
 g.fillStyle='#3fae7c';g.beginPath();g.arc(11,-2,3.6,0,7);g.fill();
 g.beginPath();g.arc(14,-5,6.5,0,7);g.fillStyle='#aeb9cc';g.fill();
 g.fillStyle='#fff';g.beginPath();g.arc(16,-7,1.9,0,7);g.fill();
 g.fillStyle='#222';g.beginPath();g.arc(16.7,-7,0.95,0,7);g.fill();
 g.fillStyle='#f2a541';g.beginPath();g.moveTo(19,-6);g.lineTo(26,-4);g.lineTo(19,-2.5);g.closePath();g.fill();
 wing(1);
 g.restore();
}
function drawGuard(gd){
 g.save();g.translate(gd.x,gd.y);
 g.save();g.rotate(gd.a);
 g.fillStyle=gd.see?'rgba(255,80,80,.30)':'rgba(255,240,150,.15)';
 g.beginPath();g.moveTo(0,0);g.arc(0,0,GRANGE,-GHALF,GHALF);g.closePath();g.fill();
 g.restore();
 g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(0,12,10,4,0,0,7);g.fill();
 g.fillStyle='#2f3b57';g.fillRect(-6,-8,12,18);
 g.fillStyle='#e8b58a';g.beginPath();g.arc(0,-12,5.5,0,7);g.fill();
 g.fillStyle='#1d2740';g.beginPath();g.arc(0,-13.5,5.5,Math.PI,0);g.fill();g.fillRect(0,-14.5,9,3);
 g.restore();
 if(gd.see){g.fillStyle='#ff5050';g.font='bold 22px monospace';g.textAlign='center';g.fillText('!',gd.x,gd.y-24);}
}
function overlay(title,lines,color){
 g.fillStyle='rgba(6,10,18,.8)';g.fillRect(0,0,VW,VH);
 g.textAlign='center';g.fillStyle=color;g.font='bold 40px monospace';g.fillText(title,VW/2,VH/2-90);
 g.font='15px monospace';g.fillStyle='#cfe3ff';
 lines.forEach((l,i)=>g.fillText(l,VW/2,VH/2-40+i*26));
 g.fillStyle='#9fe870';g.font='bold 16px monospace';
 g.fillText(state==='brief'?'[ PRESS ENTER TO DEPLOY ]':'[ PRESS R TO FLY AGAIN ]',VW/2,VH/2+96);
}
function draw(){
 camx=Math.max(0,Math.min(W-VW,p.x-VW/2));
 camy=Math.max(0,Math.min(H-VH,p.y-VH/2));
 g.save();g.translate(-camx,-camy);
 g.fillStyle='#5e9c4f';g.fillRect(camx,camy,VW,VH);
 g.fillStyle='#767b84';g.fillRect(0,640,W,80);g.fillRect(1000,0,70,H);
 g.fillStyle='#8d929b';g.fillRect(0,676,W,8);g.fillRect(1031,0,8,H);
 g.fillStyle='#4f8f43';g.fillRect(park.x,park.y,park.w,park.h);
 g.strokeStyle='#3e7434';g.lineWidth=3;g.strokeRect(park.x,park.y,park.w,park.h);g.lineWidth=1;
 g.fillStyle='#cbb98a';g.fillRect(1022,park.y,26,park.h);g.fillRect(park.x,1082,park.w,24);
 g.fillStyle='#9fb7c9';g.beginPath();g.arc(fountain.x,fountain.y,fountain.r,0,7);g.fill();
 g.fillStyle='#5aa7d1';g.beginPath();g.arc(fountain.x,fountain.y,fountain.r-8,0,7);g.fill();
 g.fillStyle='rgba(255,255,255,.5)';
 g.beginPath();g.arc(fountain.x-6+4*Math.sin(performance.now()/300),fountain.y-4,3,0,7);g.fill();
 for(const b of buildings){
  g.fillStyle='#55607a';g.fillRect(b.x,b.y,b.w,b.h);
  g.fillStyle='#66738f';g.fillRect(b.x,b.y,b.w,10);
  g.fillStyle='rgba(220,235,255,.45)';
  for(let wx=b.x+14;wx<b.x+b.w-12;wx+=26)
   for(let wy=b.y+18;wy<b.y+b.h-12;wy+=30)g.fillRect(wx,wy,10,12);
  g.strokeStyle='#3c4457';g.strokeRect(b.x+.5,b.y+.5,b.w,b.h);
 }
 for(const t of trees){
  g.fillStyle='#6b4a2b';g.fillRect(t.x-2,t.y,4,10);
  g.fillStyle='#3e7434';g.beginPath();g.arc(t.x,t.y-6,t.r,0,7);g.fill();
  g.fillStyle='#4f8f43';g.beginPath();g.arc(t.x-3,t.y-9,t.r*.6,0,7);g.fill();
 }
 for(const pr of people)drawPerson(g,pr,pr.x,pr.y,pr.a,false);
 let nearest=null,nd=1e9;
 for(const pr of people){const d=Math.hypot(p.x-pr.x,p.y-pr.y);if(d<nd){nd=d;nearest=pr;}}
 const inRange=nd<175;
 if(inRange&&nearest===target&&(scan>0||keys.Space)){
  g.strokeStyle='rgba(80,220,255,.5)';g.setLineDash([6,8]);
  g.beginPath();g.moveTo(p.x,p.y);g.lineTo(nearest.x,nearest.y);g.stroke();g.setLineDash([]);
 }
 for(const s of scanFx){
  const sx=p.x+(target.x-p.x)*s.t,sy=p.y+(target.y-p.y)*s.t;
  g.fillStyle='rgba(80,220,255,'+(1-s.t)+')';g.fillRect(sx-2,sy-2,4,4);
 }
 for(const r of rings){
  g.strokeStyle=r.gold?'rgba(255,209,102,'+Math.max(r.l,0)+')':'rgba(80,220,255,'+Math.max(r.l,0)+')';
  g.lineWidth=2;g.beginPath();g.arc(r.x,r.y,r.r,0,7);g.stroke();g.lineWidth=1;
 }
 for(const f of feathers){
  g.fillStyle='rgba(255,255,255,'+Math.max(f.l*.9,0)+')';
  g.beginPath();g.ellipse(f.x,f.y,3,1.6,f.l*3,0,7);g.fill();
 }
 for(const f of floaters){
  g.globalAlpha=Math.min(1,f.t);g.fillStyle=f.c;g.font='bold 13px monospace';g.textAlign='center';
  g.fillText(f.text,f.x,f.y);g.globalAlpha=1;
 }
 for(const gd of guards)drawGuard(gd);
 drawPigeon(p.x,p.y,p.a);
 for(const c of clouds){
  g.fillStyle='rgba(255,255,255,.85)';
  g.beginPath();g.ellipse(c.x,c.y,46*c.s,16*c.s,0,0,7);g.fill();
  g.beginPath();g.ellipse(c.x-24*c.s,c.y+6*c.s,26*c.s,12*c.s,0,0,7);g.fill();
  g.beginPath();g.ellipse(c.x+26*c.s,c.y+7*c.s,28*c.s,12*c.s,0,0,7);g.fill();
 }
 g.restore();
 // HUD
 if(state==='play'||state==='fail'){
  // target profile panel
  g.fillStyle='rgba(8,12,20,.75)';g.fillRect(8,34,252,162);
  g.strokeStyle='rgba(159,232,112,.55)';g.strokeRect(8,34,252,162);
  g.textAlign='left';g.fillStyle='#9fe870';g.font='bold 12px monospace';
  g.fillText('TARGET PROFILE',16,52);
  g.drawImage(pcv,14,58);
  g.fillStyle='#cfe3ff';g.font='11px monospace';
  const L=[target.shirtName+' SHIRT',target.pantsName+' PANTS',
   target.hair==='BALD'?'BALD':target.hair+' '+target.hairName+' HAIR',
   target.hat==='NONE'?'NO HAT':target.hat+' (SEE PORTRAIT)',
   target.glasses?'WEARS GLASSES':'NO GLASSES'];
  L.forEach((l,i)=>g.fillText(l,116,72+i*16));
  g.fillStyle='#ffd166';g.font='bold 12px monospace';
  g.fillText('INTEL SECURED: '+intel+(best?'   BEST: '+best:''),116,176);
  g.textAlign='left';g.fillStyle='#5b6b85';g.font='11px monospace';
  g.fillText('SAT-LINK pings the target every few seconds',16,212);
 }
 if(state==='play'){
  if(inRange&&(scan>0||keys.Space)){
   const bx=VW/2-120,by=VH-52;
   g.textAlign='center';g.fillStyle=wrongFlash>0?'#ff7070':'#e6f2ff';g.font='12px monospace';
   g.fillText(wrongFlash>0?'NOT THE TARGET — HEAT RISING':'DOWNLOADING INTEL '+Math.round(scan*100)+'%',VW/2,by-10);
   g.fillStyle='rgba(0,0,0,.5)';g.fillRect(bx-3,by-3,246,22);
   g.fillStyle='#1c2733';g.fillRect(bx,by,240,16);
   g.fillStyle=wrongFlash>0?'#ff5050':'#39d0d8';g.fillRect(bx,by,240*(wrongFlash>0?alert/100:scan),16);
   g.strokeStyle='#9fe870';g.strokeRect(bx,by,240,16);
  }
  g.textAlign='left';g.font='12px monospace';g.fillStyle='#ffb3b3';g.fillText('HEAT',VW-224,24);
  g.fillStyle='#1c2733';g.fillRect(VW-184,14,170,12);
  g.fillStyle=alert>60?'#ff4040':'#ff9f43';g.fillRect(VW-184,14,170*alert/100,12);
  g.strokeStyle='rgba(255,255,255,.4)';g.strokeRect(VW-184,14,170,12);
  g.fillStyle='#e6f2ff';g.fillText('T '+tGame.toFixed(1)+'s',14,VH-14);
  const mw=180,mh=117,mx0=VW-mw-10,my0=VH-mh-10,s=mw/W;
  g.fillStyle='rgba(10,14,24,.8)';g.fillRect(mx0,my0,mw,mh);
  g.fillStyle='#4f8f43';g.fillRect(mx0+park.x*s,my0+park.y*s,park.w*s,park.h*s);
  g.fillStyle='#66738f';for(const b of buildings)g.fillRect(mx0+b.x*s,my0+b.y*s,b.w*s,b.h*s);
  g.fillStyle='rgba(255,255,255,.55)';for(const pr of people)g.fillRect(mx0+pr.x*s-1,my0+pr.y*s-1,2,2);
  g.fillStyle='#ff5050';for(const gd of guards){g.beginPath();g.arc(mx0+gd.x*s,my0+gd.y*s,2.2,0,7);g.fill();}
  g.fillStyle='#fff';g.beginPath();g.arc(mx0+p.x*s,my0+p.y*s,2.8,0,7);g.fill();
  g.strokeStyle='rgba(159,232,112,.6)';g.strokeRect(mx0,my0,mw,mh);
  g.strokeStyle='rgba(255,255,255,.25)';g.strokeRect(mx0+camx*s,my0+camy*s,VW*s,VH*s);
  g.fillStyle='#5b6b85';g.font='10px monospace';g.textAlign='right';g.fillText('SAT-LINK',mx0+mw-4,my0+12);
  if(alert>45){
   const a=(alert-45)/55*0.5;
   const gr=g.createRadialGradient(VW/2,VH/2,VH/3,VW/2,VH/2,VH);
   gr.addColorStop(0,'rgba(255,0,0,0)');gr.addColorStop(1,'rgba(255,30,30,'+a+')');
   g.fillStyle=gr;g.fillRect(0,0,VW,VH);
  }
 }
 if(state==='brief')overlay('OPERATION COO \u{1F54A}\uFE0F',[
  'You are Pigeon-7, a government spy pigeon. The park is crawling with civilians.',
  'HQ uploads a TARGET PROFILE (top-left). Find that exact person in the crowd.',
  'FLY: WASD / arrow keys.   SCAN: hold SPACE next to the target.',
  'Each scanned target = 1 INTEL, and HQ immediately assigns the next one.',
  'Sat-link pings reveal the target\u2019s rough position. Guards\u2019 cones raise HEAT.',
  'Scanning the WRONG person also raises heat. 100% = cover blown.'],'#9fe870');
 if(state==='fail')overlay('COVER BLOWN',[
  'The agency denies all knowledge of you. The park is locked down.',
  'Intel secured this run: '+intel+(best?'   (best: '+best+')':''),
  'Payment withheld: zero (0) bagels.'],'#ff5050');
}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>

</body></html>
